apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi-nginx
  namespace: python-fastapi
spec:
  ingressClassName: nginx

  rules:
    - host: app.local.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: python-fastapi
                port:
                  number: 80
