
apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:
  name: platform
  namespace: argocd

spec:
  description: Local EKS Platform Infrastructure

  sourceRepos:
    # Git Repo : Platform Helm values
    - https://github.com/ChiehChang0319/argocd-repo-test.git

    # Ingress NGINX Helm Repository
    - https://kubernetes.github.io/ingress-nginx

    # Envoy Gateway OCI Registry
    - docker.io/envoyproxy

  destinations:
    - namespace: ingress-nginx
      server: https://kubernetes.default.svc

    - namespace: envoy-gateway-system
      server: https://kubernetes.default.svc

  # Cluster-scoped resources required by Helm charts
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    - group: networking.k8s.io
      kind: IngressClass

    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
