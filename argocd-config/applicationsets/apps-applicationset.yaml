apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: apps-applicationset
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/ChiehChang0319/argocd-repo-test.git
        revision: main
        directories:
          - path: apps/*

  template:
    metadata:
      name: '{{.path.basename}}'

    spec:
      project: apps

      source:
        repoURL: https://github.com/ChiehChang0319/argocd-repo-test.git
        targetRevision: main
        path: '{{.path.path}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: apps

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
